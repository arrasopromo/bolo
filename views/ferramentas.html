<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas - BelleCake</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { margin: 0; }
        .tools-app {
            display: flex; min-height: 100vh; background: var(--bg-cream);
        }
        .sidebar {
            width: 260px; background: #73401F; color: #fff;
            display: flex; flex-direction: column; padding: 2rem 1.25rem;
            border-right: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar .logo {
            display: block; margin: 0 auto 1.2rem; max-width: 160px; filter: brightness(0) invert(1);
        }
        .nav-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.7rem 1rem; border-radius: 12px; cursor: pointer;
            color: rgba(255,255,255,0.82); transition: background 0.2s, transform 0.1s;
        }
        .nav-item:hover { background: rgba(255,255,255,0.08); transform: translateX(2px); }
        .nav-item i { width: 20px; height: 20px; }
        .submenu { display: none; flex-direction: column; gap: 0.2rem; padding-left: 2rem; margin-top: 0.2rem; }
        .tools-frame { flex: 1; border: none; width: 100%; height: 100vh; display: block; background: #fff; }
        .bottom-stack { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .nova-venda-btn {
            width: 100%;
            background: #4CAF50;
            color: #fff;
            border: none;
            padding: 0.8rem 0.6rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 10px rgba(76,175,80,0.3);
        }
    </style>
</head>
<body>
    <div class="tools-app">
        <aside class="sidebar">
            <img src="/images/LOGO%20BELLE%20CAKE.webp" alt="Belle Cake" class="logo">
            <button class="nova-venda-btn" onclick="novaVenda()">
                <i data-lucide="plus-circle"></i> Nova Venda
            </button>
            <ul class="nav-menu">
                <li class="nav-item" onclick="loadFluxo('resumo')"><i data-lucide="layout-dashboard"></i> Resumo</li>
                <li class="nav-item" onclick="loadFluxo('custos')"><i data-lucide="dollar-sign"></i> Custos Fixos</li>
                <li class="nav-item" onclick="loadFluxo('vendas')"><i data-lucide="shopping-cart"></i> Vendas</li>
            </ul>
            <div class="bottom-stack">
                <div class="nav-item" onclick="toggleSubmenu('subPrecificacao')" style="justify-content: space-between;">
                    <span style="display:flex; align-items:center; gap:0.8rem;"><i data-lucide="calculator"></i> Precificação</span>
                    <i data-lucide="chevron-down"></i>
                </div>
                <div id="subPrecificacao" class="submenu">
                    <div class="nav-item" onclick="event.stopPropagation(); loadPrecificacao('produtos')" style="padding:0.45rem 0.8rem;">Produtos</div>
                    <div class="nav-item" onclick="event.stopPropagation(); loadPrecificacao('ingredientes')" style="padding:0.45rem 0.8rem;">Ingredientes</div>
                </div>
                <div class="nav-item" onclick="loadEquilibrio()"><i data-lucide="activity"></i> Ponto de Equilíbrio</div>
                <div class="nav-item" onclick="loadFluxo('updates')"><i data-lucide="bell"></i> Atualizações</div>
                <div class="nav-item" onclick="loadFluxo('assinatura')"><i data-lucide="calendar-clock"></i> Assinatura</div>
                <div class="nav-item" onclick="window.location.href='/membros'"><i data-lucide="arrow-left"></i> Voltar Painel</div>
            </div>
        </aside>
        <iframe id="toolsFrame" class="tools-frame" src="/fluxo?embed=1&view=resumo" title="Ferramentas"></iframe>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        function checkFrameAuth() {
            const frame = document.getElementById('toolsFrame');
            if (!frame || !frame.contentWindow) return;
            try {
                const loc = frame.contentWindow.location;
                const path = (loc && loc.pathname) || '';
                if (path.startsWith('/membros') || path.startsWith('/login')) {
                    window.location.href = '/membros';
                }
            } catch (e) {
                // ignore cross-origin or other access errors
            }
        }

        function toggleSubmenu(id){
            const el = document.getElementById(id);
            if(!el) return;
            const open = el.style.display === 'flex';
            el.style.display = open ? 'none' : 'flex';
        }
        function novaVenda(){
            const frame = document.getElementById('toolsFrame');
            if (!frame) return;
            try {
                frame.contentWindow.postMessage({ type: 'nova-venda' }, '*');
            } catch(e) {}
            loadFluxo('vendas');
        }
        function loadFluxo(view){
            const frame = document.getElementById('toolsFrame');
            frame.src = '/fluxo?embed=1&view=' + encodeURIComponent(view || 'resumo');
        }
        function loadPrecificacao(tab){
            const frame = document.getElementById('toolsFrame');
            frame.src = '/precificacao?embed=1&tab=' + encodeURIComponent(tab || 'produtos');
        }
        function loadEquilibrio(){
            const frame = document.getElementById('toolsFrame');
            frame.src = '/equilibrio?embed=1';
        }
        document.addEventListener('DOMContentLoaded', function () {
            const frame = document.getElementById('toolsFrame');
            if (frame) {
                frame.addEventListener('load', checkFrameAuth);
            }
            try{ lucide && lucide.createIcons && lucide.createIcons(); }catch(e){}
        });
    </script>
</body>
</html>
